apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: tkt-api-gateway:v7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: AUTH_GRPC_URL
              value: "auth-service:50051"
            - name: CATALOG_GRPC_URL
              value: "catalog-service:50052"
            - name: INVENTORY_GRPC_URL
              value: "inventory-service:50053"
            - name: ORDER_GRPC_URL
              value: "order-service:50054"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 4000
      targetPort: 4000
